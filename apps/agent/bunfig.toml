[test]
# Function threshold is 0.75 because shared capability files are intentionally
# small (4-7 functions each) and several expose default error formatters /
# fallbacks that are not exercised on the happy path.
coverageThreshold = { lines = 0.9, functions = 0.75 }
coveragePathIgnorePatterns = [
  "../**",
  "**/dist/**",
  "**/__test-utils__/**",
  "**/components/AgentMode.tsx",
  "**/agent/wire.ts",
  "**/agent/wire/**",
  "**/agent/post-task.ts",
  "**/agent/json-runner.ts",
  # spec-attachments has error-handling catch branches for network failures that
  # require injecting API errors to cover; happy-path coverage is thorough.
  "**/agent/linear-sync/spec-attachments.ts",
  "**/shared/capabilities/types.ts",
  "**/features/mention/github.ts",
  "**/features/confirmation/awaiting.ts",
  "**/features/review-followup/scan.ts",
  # list.ts is integration code (network, filesystem, terminal output) — only
  # buildBuckets is unit-testable and is covered in list-buckets.test.ts.
  "**/list.ts",
]
